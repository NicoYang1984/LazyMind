name: PR921 isolated diagnostics
on:
  push:
    branches: [codex/pr921-ci-diagnostics]
permissions:
  contents: read
jobs:
  postgres-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_DRIVER: postgres
      TEST_DB_DSN: postgres://root:test-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: backend/core/go.sum
      - name: Record exact tested source and PostgreSQL version
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-head.txt
          sha256sum backend/core/workflow/external_agent_recovery_test.go > evidence/test-source.sha256
          PGPASSWORD=test-password psql -h 127.0.0.1 -U root -d postgres -c 'select version();' > evidence/postgres-version.txt
      - name: Verify each fixed test on PostgreSQL
        shell: bash
        run: |
          set +e
          overall=0
          for test in TestExternalTaskCollectsRecoveredSessionWithoutExecuting TestExternalTaskRecoveryRollsBackWhenResultProjectionFails TestExternalTaskRecoveryRequiresCompletedProjection; do
            echo "go test ./workflow -run ^${test}$ -count=1 -v" > "evidence/$test.command"
            (cd backend/core && go test ./workflow -run "^${test}$" -count=1 -v) > "evidence/$test.log" 2>&1
            result=$?
            echo "$result" > "evidence/$test.exit"
            cat "evidence/$test.log"
            if [ "$result" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
      - name: Full Workflow PostgreSQL regression and vet
        shell: bash
        run: |
          set +e
          echo 'go test ./workflow/... -count=1 -timeout=10m -json' > evidence/full-workflow.command
          (cd backend/core && go test ./workflow/... -count=1 -timeout=10m -json) > evidence/full-workflow.log 2>&1
          result=$?
          echo "$result" > evidence/full-workflow.exit
          tail -20 evidence/full-workflow.log
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          (cd backend/core && go vet ./workflow/...) > evidence/vet.log 2>&1
          result=$?
          echo "$result" > evidence/vet.exit
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-green-evidence
          path: evidence/
  windows-full-cold:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: 5fd90e1d7e86e0fc0f0c4aec1f94f7f59f47d79b
          - label: pr-head
            ref: 09003eb066ef2f2dea604b3f7c9cf72b12af9bdd
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          repository: NicoYang1984/LazyMind
          ref: ${{ matrix.ref }}
          path: subject
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: subject/local/lazymind-cli/go.sum
      - name: Add diagnostics before first PowerShell probe on this runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence
          git -C subject rev-parse HEAD | Out-File evidence/source-head.txt
          python diagnostics/.ci-diagnostics/instrument.py subject win
          gofmt -w subject/local/lazymind-cli/internal/agentexec/desktop_query_windows_test.go
      - name: Same full module command as CI, with elapsed/deadline/stderr output
        shell: pwsh
        env:
          GODEBUG: gocachetest=1
        run: |
          $diagnostics = (Resolve-Path evidence).Path
          Set-Location subject/local/lazymind-cli
          go test ./... -count=1 -json "-debug-actiongraph=$diagnostics/actions.json" 2> "$diagnostics/cache.log" | Tee-Object "$diagnostics/tests.jsonl"
          $code = $LASTEXITCODE
          $code | Out-File "$diagnostics/test.exit"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-full-${{ matrix.label }}-evidence
          path: evidence/
